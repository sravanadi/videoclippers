services:
  ollama:
    image: ollama/ollama:latest
    container_name: videoclipper-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper-server:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: videoclipper-whisper
    ports:
      - "8001:8000"
    environment:
      - WHISPER_MODEL=base
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - whisper_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoclipper-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - LOCAL_WHISPER_URL=http://whisper-server:8000
      - LOCAL_LLM_URL=http://ollama:11434
      - LOCAL_LLM_MODEL=deepseek-r1:1.5b
      - NEXT_PUBLIC_GEMINI_PROVIDER=local
      - NEXT_PUBLIC_GEMINI_MODEL=deepseek-r1:1.5b
      - NEXT_PUBLIC_LOCAL_LLM_MODEL=deepseek-r1:1.5b
      - NEXT_PUBLIC_CESDK_LICENSE_KEY=${NEXT_PUBLIC_CESDK_LICENSE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - whisper-server
      - ollama
    restart: unless-stopped

volumes:
  whisper_hf_cache:
  ollama_data:
    external: true
